name: videoagent

services:
  mysql:
    image: mysql:8.4
    container_name: videoagent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - videoagent-network

  redis:
    image: redis:7.4-alpine
    container_name: videoagent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - videoagent-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: videoagent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - videoagent-network

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: videoagent-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    ports:
      - "${ROCKETMQ_NAMESRV_PORT}:9876"
    healthcheck:
      test: ["CMD-SHELL", "export TERM=dumb; bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - videoagent-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: videoagent-rocketmq-broker
    restart: unless-stopped
    user: "0:0"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        chown -R rocketmq:rocketmq /home/rocketmq/store &&
        exec runuser -u rocketmq -- sh mqbroker -n rocketmq-namesrv:9876
        -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
    ports:
      - "${ROCKETMQ_BROKER_PORT}:10911"
      - "${ROCKETMQ_FAST_REMAP_PORT}:10909"
    volumes:
      - ./infra/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "export TERM=dumb; bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - videoagent-network

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: videoagent-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /livez HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | head -n 1 | grep -q \"200\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - videoagent-network

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rocketmq-store:
  qdrant-data:

networks:
  videoagent-network:
    driver: bridge
