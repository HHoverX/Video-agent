name: videoagent

services:
  mysql:
    image: mysql:8.4
    container_name: videoagent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - videoagent-network

  redis:
    image: redis:7.4-alpine
    container_name: videoagent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - videoagent-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: videoagent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - videoagent-network

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: videoagent-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    ports:
      - "${ROCKETMQ_NAMESRV_PORT}:9876"
    healthcheck:
      test: ["CMD-SHELL", "export TERM=dumb; bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - videoagent-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: videoagent-rocketmq-broker
    restart: unless-stopped
    user: "0:0"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        chown -R rocketmq:rocketmq /home/rocketmq/store &&
        exec runuser -u rocketmq -- sh mqbroker -n rocketmq-namesrv:9876
        -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m"
    ports:
      - "${ROCKETMQ_BROKER_PORT}:10911"
      - "${ROCKETMQ_FAST_REMAP_PORT}:10909"
    volumes:
      - ./infra/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "export TERM=dumb; bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - videoagent-network

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: videoagent-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - videoagent-network

  upload-gateway:
    image: nginx:1.28-alpine
    container_name: videoagent-upload-gateway
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      UPLOAD_MAX_CONNECTIONS_PER_IP: ${UPLOAD_MAX_CONNECTIONS_PER_IP:-6}
      UPLOAD_MAX_CONNECTIONS_GLOBAL: ${UPLOAD_MAX_CONNECTIONS_GLOBAL:-100}
      UPLOAD_REQUEST_RATE_PER_IP: ${UPLOAD_REQUEST_RATE_PER_IP:-20r/s}
      UPLOAD_REQUEST_BURST: ${UPLOAD_REQUEST_BURST:-40}
    ports:
      - "${MINIO_UPLOAD_GATEWAY_PORT:-9002}:9000"
    volumes:
      - ./infra/nginx/upload-gateway.conf.template:/etc/nginx/templates/upload-gateway.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9000/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - videoagent-network

  milvus-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: videoagent-milvus-minio
    restart: unless-stopped
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-object-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - videoagent-network

  milvus:
    image: milvusdb/milvus:v2.6.22
    container_name: videoagent-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_WEBUI_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    networks:
      - videoagent-network

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rocketmq-store:
  milvus-etcd-data:
  milvus-object-data:
  milvus-data:

networks:
  videoagent-network:
    driver: bridge
