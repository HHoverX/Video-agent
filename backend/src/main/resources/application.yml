spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: videoagent-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:videoagent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${VIDEO_MAX_FILE_SIZE:500MB}
      max-request-size: ${VIDEO_MAX_REQUEST_SIZE:501MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  producer:
    group: videoagent-producer
    send-message-timeout: ${ROCKETMQ_SEND_TIMEOUT:3000}

videoagent:
  analysis:
    topic: ${VIDEO_ANALYZE_TOPIC:VIDEO_ANALYZE_TOPIC}
    consumer-group: ${VIDEO_ANALYZE_CONSUMER_GROUP:videoagent-analysis-consumer}
    analysis-type: ${VIDEO_ANALYSIS_TYPE:TRANSCRIPTION}
    model-version: ${VIDEO_ANALYSIS_MODEL_VERSION:m4-ffmpeg-mock-asr-v1}
    progress-ttl: ${VIDEO_ANALYSIS_PROGRESS_TTL:24h}
  media:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffmpeg-timeout: ${FFMPEG_TIMEOUT:30s}
    temp-root: ${MEDIA_TEMP_ROOT:${java.io.tmpdir}/videoagent-media}
    stderr-max-chars: ${FFMPEG_STDERR_MAX_CHARS:4000}
  upload:
    max-file-size: ${VIDEO_MAX_FILE_SIZE:500MB}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:videoagent}
  ai:
    asr:
      provider: ${ASR_PROVIDER:mock}
      api-key: ${ASR_API_KEY:}
    llm:
      provider: ${LLM_PROVIDER:mock}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:}
