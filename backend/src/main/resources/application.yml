spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: videoagent-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:videoagent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${VIDEO_MAX_FILE_SIZE:500MB}
      max-request-size: ${VIDEO_MAX_REQUEST_SIZE:501MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  producer:
    group: videoagent-producer
    send-message-timeout: ${ROCKETMQ_SEND_TIMEOUT:3000}

videoagent:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:2h}
  analysis:
    topic: ${VIDEO_ANALYZE_TOPIC:VIDEO_ANALYZE_TOPIC}
    consumer-group: ${VIDEO_ANALYZE_CONSUMER_GROUP:videoagent-analysis-consumer}
    analysis-type: ${VIDEO_ANALYSIS_TYPE:STRUCTURED_SUMMARY}
    model-version: ${VIDEO_ANALYSIS_MODEL_VERSION:m5-langchain4j-structured-v1}
    progress-ttl: ${VIDEO_ANALYSIS_PROGRESS_TTL:24h}
    max-video-duration: ${ANALYSIS_MAX_VIDEO_DURATION:60m}
    protection:
      max-active-per-user: ${ANALYSIS_MAX_ACTIVE_PER_USER:3}
      rate-limit:
        capacity: ${ANALYSIS_RATE_LIMIT_CAPACITY:60}
        refill-tokens: ${ANALYSIS_RATE_LIMIT_REFILL_TOKENS:10}
        refill-period: ${ANALYSIS_RATE_LIMIT_REFILL_PERIOD:1s}
        cost-per-request: ${ANALYSIS_RATE_LIMIT_COST_PER_REQUEST:1}
    reliability:
      max-attempts: ${ANALYSIS_MAX_ATTEMPTS:3}
      processing-lease: ${ANALYSIS_PROCESSING_LEASE:15m}
      heartbeat-interval: ${ANALYSIS_HEARTBEAT_INTERVAL:2m}
      max-execution-time: ${ANALYSIS_MAX_EXECUTION_TIME:2h}
    recovery-interval-ms: ${ANALYSIS_RECOVERY_INTERVAL_MS:30000}
    sse:
      timeout: ${VIDEO_ANALYSIS_SSE_TIMEOUT:30m}
  outbox:
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:5s}
    backoff-multiplier: ${OUTBOX_BACKOFF_MULTIPLIER:2}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:15}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL:5000}
  rag:
    direct-context-max-chars: ${RAG_DIRECT_CONTEXT_MAX_CHARS:8000}
    chunk-max-chars: ${RAG_CHUNK_MAX_CHARS:2000}
    chunk-overlap-segments: ${RAG_CHUNK_OVERLAP_SEGMENTS:1}
    dense-top-k: ${RAG_DENSE_TOP_K:15}
    dense-minimum-score: ${RAG_DENSE_MINIMUM_SCORE:0.0}
    lexical-top-k: ${RAG_LEXICAL_TOP_K:15}
    rrf-k: ${RAG_RRF_K:60}
    rrf-candidate-limit: ${RAG_RRF_CANDIDATE_LIMIT:15}
    final-evidence-limit: ${RAG_FINAL_EVIDENCE_LIMIT:5}
    reranker:
      enabled: ${RAG_RERANKER_ENABLED:false}
      base-url: ${RAG_RERANKER_BASE_URL:}
      api-key: ${RAG_RERANKER_API_KEY:}
      model: ${RAG_RERANKER_MODEL:}
      timeout: ${RAG_RERANKER_TIMEOUT:3s}
    milvus:
      uri: ${MILVUS_URI:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      collection: ${MILVUS_COLLECTION:video_transcript_chunks}
      timeout: ${MILVUS_TIMEOUT:10s}
    embedding:
      provider: ${EMBEDDING_PROVIDER:mock}
      api-key: ${EMBEDDING_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:}
      model: ${EMBEDDING_MODEL:}
      dimension: ${EMBEDDING_DIMENSION:384}
      timeout: ${EMBEDDING_TIMEOUT:30s}
  agent:
    planner-provider: ${AGENT_PLANNER_PROVIDER:mock}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:4}
    time-lookup-window-ms: ${AGENT_TIME_LOOKUP_WINDOW_MS:15000}
    max-time-window-ms: ${AGENT_MAX_TIME_WINDOW_MS:120000}
    max-evidence-items: ${AGENT_MAX_EVIDENCE_ITEMS:12}
    max-evidence-chars: ${AGENT_MAX_EVIDENCE_CHARS:12000}
    planner-model: ${AGENT_PLANNER_MODEL:}
    memory:
      ttl: ${AGENT_MEMORY_TTL:24h}
      max-turns: ${AGENT_MEMORY_MAX_TURNS:6}
      max-history-chars: ${AGENT_MEMORY_MAX_HISTORY_CHARS:6000}
  media:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    ffmpeg-timeout: ${FFMPEG_TIMEOUT:30s}
    temp-root: ${MEDIA_TEMP_ROOT:${java.io.tmpdir}/videoagent-media}
    stderr-max-chars: ${FFMPEG_STDERR_MAX_CHARS:4000}
  upload:
    max-file-size: ${VIDEO_RESUMABLE_MAX_FILE_SIZE:20GB}
    default-chunk-size: ${VIDEO_UPLOAD_DEFAULT_CHUNK_SIZE:16MB}
    min-chunk-size: ${VIDEO_UPLOAD_MIN_CHUNK_SIZE:5MB}
    max-chunk-size: ${VIDEO_UPLOAD_MAX_CHUNK_SIZE:128MB}
    max-parts: ${VIDEO_UPLOAD_MAX_PARTS:10000}
    session-ttl: ${VIDEO_UPLOAD_SESSION_TTL:24h}
    presign-ttl: ${VIDEO_UPLOAD_PRESIGN_TTL:15m}
    max-client-concurrency: ${VIDEO_UPLOAD_MAX_CONCURRENCY:3}
    completion-timeout: ${VIDEO_UPLOAD_COMPLETION_TIMEOUT:30m}
    completion-recovery-interval-ms: ${VIDEO_UPLOAD_COMPLETION_RECOVERY_INTERVAL_MS:30000}
    cleanup-interval-ms: ${VIDEO_UPLOAD_CLEANUP_INTERVAL_MS:300000}
  playback:
    presign-ttl: ${VIDEO_PLAYBACK_PRESIGN_TTL:60m}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    upload-endpoint: ${MINIO_UPLOAD_ENDPOINT:${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:videoagent}
  ai:
    asr:
      provider: ${ASR_PROVIDER:mock}
      api-key: ${ASR_API_KEY:}
      model: ${ASR_MODEL:}
      base-url: ${ASR_BASE_URL:}
      timeout: ${ASR_TIMEOUT:60s}
      language-hints: ${ASR_LANGUAGE_HINTS:}
    llm:
      provider: ${LLM_PROVIDER:mock}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:}
      base-url: ${LLM_BASE_URL:}
      timeout: ${LLM_TIMEOUT:60s}
      max-retries: ${LLM_MAX_RETRIES:1}
      structured-output-mode: ${LLM_STRUCTURED_OUTPUT_MODE:json_schema}
      max-user-prompt-chars: ${LLM_MAX_USER_PROMPT_CHARS:50000}
